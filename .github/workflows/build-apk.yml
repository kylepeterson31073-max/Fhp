name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & Licenses
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Initialize & Sync Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configure Android Permissions & Build Settings
        run: |
          node -e '
          const fs = require("fs");
          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          if (fs.existsSync(manifestPath)) {
            let manifest = fs.readFileSync(manifestPath, "utf8");
            const permissions = [
              "android.permission.INTERNET",
              "android.permission.CALL_PHONE",
              "android.permission.SEND_SMS",
              "android.permission.RECEIVE_SMS",
              "android.permission.READ_PHONE_STATE",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.POST_NOTIFICATIONS"
            ];
            
            permissions.forEach(perm => {
              if (!manifest.includes(perm)) {
                manifest = manifest.replace("</manifest>", "    <uses-permission android:name=\"" + perm + "\" />\n</manifest>");
              }
            });
            fs.writeFileSync(manifestPath, manifest, "utf8");
            console.log("AndroidManifest.xml updated with native telephony permissions.");
          }
          '

      - name: Grant Execute Permission to Gradle
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon -x lint

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daisys-helping-paws-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release (On Tag or Main Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Daisy's Helping Paws Android APK v1.0.${{ github.run_number }}
          body: |
            ### 🐾 Daisy's Helping Paws - Autonomous Mobile APK
            
            **Automated Android APK Release**
            - 📱 Direct phone calling with automated IVR DTMF navigation
            - 💬 1-tap autonomous SMS intent dispatch for emergency shelter, food stamps, and clinic vouchers
            - 📧 Certified agency email filing
            - 🗺️ Offline-ready crowd-sourced GPS resource map
            
            Download the `app-debug.apk` below and install directly on your Android phone.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
