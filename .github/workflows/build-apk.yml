name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Initialize & Sync Android Platform
        run: |
          if [ ! -d "android" ] || [ ! -f "android/build.gradle" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daisys-helping-paws-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release (On Tag or Main Push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Daisy's Helping Paws Android APK v1.0.${{ github.run_number }}
          body: |
            ### 🐾 Daisy's Helping Paws - Autonomous Mobile APK
            
            **Automated Android APK Release**
            - 📱 Direct phone calling with automated IVR DTMF navigation
            - 💬 1-tap autonomous SMS intent dispatch for emergency shelter, food stamps, and clinic vouchers
            - 📧 Certified agency email filing
            - 🗺️ Offline-ready crowd-sourced GPS resource map
            
            Download the `app-debug.apk` below and install directly on your Android phone.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
